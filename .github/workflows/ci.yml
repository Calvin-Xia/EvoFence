name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: install
        run: npm ci
      # Type-check and build explicitly before `npm test`. `npm test` builds on its own,
      # but a compile or type failure then surfaces as a failing test step; keeping
      # typecheck and build first makes each gate report itself.
      - name: typecheck
        run: npm run typecheck
      # Source-shape gate: no `.js` under `src/` (would escape the TypeScript program) and no
      # `src/**/*.ts` over 350 lines. Static, no build needed, so it runs right after typecheck.
      - name: src:policy
        run: npm run src:policy
      - name: build
        run: npm run build
      # Configuration documentation is checked against the built config schema, independently
      # from the source-shape, dependency, and test gates.
      - name: config:doc
        run: npm run config:doc
      # The module-graph cycle gate lives in `npm run check`, which CI does not call,
      # so without this step the acyclicity gate never runs in CI. Static and fast.
      - name: dep:check
        run: npm run dep:check
      - name: test
        run: npm test
      # `test-e2e/` sits outside the tree `node --test` discovers, so this suite only
      # runs when a step asks for it. Deliberately sequential after `npm test`: its CLI
      # subprocesses starve the timing-sensitive budgets in `test/`.
      - name: test:e2e
        run: npm run test:e2e
      - name: pack
        run: npm pack --dry-run
