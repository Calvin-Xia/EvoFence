name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm CLI with Trusted Publishing support
        run: npm install --global npm@11.17.0

      - name: Verify npm CLI version
        run: test "$(npm --version)" = "11.17.0"

      - run: npm ci
      - run: npm test

      - name: Verify release metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/verify-release-metadata.js

      - name: Publish prerelease to beta
        if: github.event.release.prerelease
        run: npm publish --tag beta

      - name: Publish stable release to latest
        if: ${{ !github.event.release.prerelease }}
        run: npm publish --tag latest
