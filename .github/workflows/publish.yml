name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci
      - run: npm test

      - name: Verify release metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const releaseVersion = process.env.RELEASE_TAG.replace(/^v/, '');
          const releaseIsPrerelease = process.env.RELEASE_IS_PRERELEASE === 'true';
          const packageIsPrerelease = version.split('+', 1)[0].includes('-');

          if (releaseVersion !== version) {
            throw new Error(`Release tag ${process.env.RELEASE_TAG} does not match package version ${version}`);
          }

          if (releaseIsPrerelease !== packageIsPrerelease) {
            throw new Error('GitHub Release prerelease status must match the package SemVer version');
          }
          NODE

      - name: Publish prerelease to beta
        if: github.event.release.prerelease
        run: npm publish --tag beta

      - name: Publish stable release to latest
        if: ${{ !github.event.release.prerelease }}
        run: npm publish --tag latest
