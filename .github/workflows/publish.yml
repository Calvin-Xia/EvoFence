name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Audit G10: the publish path had no timeout either; a hung `npm test` must not hold the job
    # until GitHub's six-hour default while a release is pending.
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm CLI with Trusted Publishing support
        run: npm install --global npm@11.17.0

      - name: Verify npm CLI version
        run: test "$(npm --version)" = "11.17.0"

      - run: npm ci

      # `dist/` is the published artifact (adr_0002), not the repository tree: since
      # 0.4.0 `package.json` bin/exports/types point into `dist/` and `files` ships it.
      # Everything below therefore has to run against a fresh build, and type-check and
      # build stay explicit steps so a compile failure reports itself instead of
      # surfacing as a confusing failing `npm test` (same rationale as ci.yml).
      - name: Type-check
        run: npm run typecheck

      - name: Build dist
        run: npm run build

      - name: Verify release metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/verify-release-metadata.js

      # Static guard for the Trusted Publishing wiring itself: `id-token: write`,
      # the pinned npm CLI with a version self-check, and `npm publish --tag ...`.
      - name: Verify publish workflow configuration
        run: node scripts/verify-publish-workflow.js

      - name: Test before publishing
        run: npm test

      - name: Publish prerelease to beta
        if: github.event.release.prerelease
        run: npm publish --tag beta

      - name: Publish stable release to latest
        if: ${{ !github.event.release.prerelease }}
        run: npm publish --tag latest
