id: ctx_gate
type: context
label: 门禁判定域
level: 1
status: pending
attempts: 0
max_attempts: 3
created_at: '2026-09-27T06:09:13.166Z'
updated_at: '2026-09-27T06:10:16.903Z'
boundary: >-
  负责 contract、evidence、policy、budget、isolation 各判定面的判定逻辑与 fail-closed 判定语义（输入缺失或不可判即不通过）；不负责执行编排（由 ctx_exec
  调用判定并推进运行）、账本记录（判定证据由 ctx_ledger 落链）、配置解析（判定输入由 ctx_io 提供）与集成适配（判定结论经 ctx_io 命令面与 ctx_ext 消费面输出）。
glossary:
  - term: 门禁判定
    definition: '对一次候选变更给出通过或不通过结论的独立判定单元，覆盖 contract、evidence、policy、budget、isolation 判定面。Avoid: 验收、人工裁决'
  - term: fail-closed
    definition: '判定输入缺失、超时或不可判时一律按不通过处理的语义，禁止默认放行。Avoid: 尽力判定、宽松模式'
  - term: 判定输入
    definition: 门禁判定消费的结构化输入，含合约条款、证据引用、策略声明、预算额度与隔离信息
contracts:
  - to: ctx_io
    contract:
      produces: 门禁判定结论（通过或不通过与理由）与门禁模块验收证据
      consumed_by:
        - artifact: CLI gate 命令面与单元测试套件
          used_as: 命令面输出与门禁负向断言的输入
      validation:
        criteria: 门禁模块可被单独导入，输入缺失场景返回不通过且附缺失原因，tsc --noEmit 退出码 0
