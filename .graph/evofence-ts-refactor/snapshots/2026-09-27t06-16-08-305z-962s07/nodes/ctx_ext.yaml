boundary: >-
  负责集成与扩展消费面：integrations 下各适配器、仓库自带的 pi 扩展加载面与 herdr 派单执行面（pane 与 worktree 的对应关系）；不负责 CLI 命令面与 config 格式的定义（由 ctx_io
  契约输出）、领域模块内部实现（ctx_gate、ctx_exec、ctx_ledger）。
glossary:
  - term: 集成消费方
    definition: '按契约调用 EvoFence CLI 与加载扩展的外部适配面，含 integrations 下各目录与仓库自带的 pi 扩展。Avoid: 内部模块'
  - term: 派单
    definition: 把节点任务交给执行 agent 的调度动作，要求 pane 与节点 claim_by 一一对应、并发执行 agent 数 ≤4、并行写操作在各自 worktree 内进行
  - term: 白名单模型
    definition: '派单允许使用的执行模型集合：deepseek/deepseek-flash 与 xiaomi/mimo-v2.6-pro 两个 high 档。Avoid: 任意模型'
contracts:
  - to: ctx_exec
    contract:
      produces: 派单就绪的执行请求与隔离工作树（herdr pane 与 git worktree 对应关系）
      consumed_by:
        - artifact: 执行编排模块
          used_as: 候选变更的实际执行入口与隔离边界
      validation:
        criteria: git worktree list 可见并行写任务各自的检出，主检出无候选写入
  - to: ctx_io
    contract:
      produces: 集成消费方对齐证据与 herdr 派单审计记录（pane 与 claim_by 映射、模型清单）
      consumed_by:
        - artifact: 发布流水线彩排与终局验收
          used_as: 消费方兼容证据与派单合规证据
      validation:
        criteria: 派单审计中模型全部在白名单内，pane 与 claim_by 映射双向唯一，集成冒烟退出码 0
