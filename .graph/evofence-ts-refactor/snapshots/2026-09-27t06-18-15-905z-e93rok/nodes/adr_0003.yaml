id: adr_0003
type: adr
label: CLI 命令面重设计：命令分组与 --json 契约可破坏性调整
level: 1
status: proposed
attempts: 0
max_attempts: 0
created_at: '2026-09-27T06:17:15.600Z'
updated_at: '2026-09-27T06:17:15.600Z'
decision: 0.4.0 重新划分 CLI 命令分组与 flag 命名，--json 输出契约与退出码约定统一到新命令面；0.3.0 的命令行用法不保持兼容，破坏性调整写入 BREAKING 说明。
background: 0.3.0 为手写 dispatcher，命令与 flag 命名随实现累积；模块化 TypeScript 重构是重新划定命令面的机会，集成消费方与文档需同步。
considered_options: >-
  A 保持 0.3.0 命令面完全兼容 → 落选：旧命名与新模块边界不匹配，兼容层成为长期负担；B 按领域分组重设计并配 BREAKING 说明 → 选中：命令面与模块边界同构，文档与集成一次性对齐；C 引入第三方 CLI 框架 →
  落选：新增运行时依赖，违背仅允许构建期 devDependencies 的约束
why: 命令面与模块边界同构后，测试、文档与集成以同一份命令面清单为准；破坏性调整已获目标契约授权。
consequences: 集成适配器必须同步改写调用；文档与冒烟测试以新命令面清单为准；旧脚本用法失效，需在 CHANGELOG 标 BREAKING。
