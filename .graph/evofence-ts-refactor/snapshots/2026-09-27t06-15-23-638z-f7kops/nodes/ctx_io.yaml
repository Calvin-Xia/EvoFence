id: ctx_io
type: context
label: 配置与对外产物域
level: 1
status: pending
attempts: 0
max_attempts: 3
created_at: '2026-09-27T06:09:14.452Z'
updated_at: '2026-09-27T06:10:50.096Z'
boundary: >-
  负责配置与对外产物表面：config 格式与解析、CLI 命令面、报告/状态/审计视图、共享类型契约层、构建产物（dist
  与类型声明）、文档发布面，以及这些表面的测试与验收证据汇总；不负责门禁判定逻辑（ctx_gate）、执行编排（ctx_exec）、账本内核（ctx_ledger）与集成适配（ctx_ext）。
glossary:
  - term: 命令面
    definition: 'CLI 暴露的子命令与 flag 集合及其退出码、--json 输出契约的总称。Avoid: 命令实现'
  - term: 类型契约层
    definition: '零运行时依赖的共享类型定义层，位于模块依赖方向最底层，各领域模块单向向下依赖它。Avoid: 公共工具类'
  - term: 对外产物
    definition: '发布给消费方的构建产物与元数据：dist 下的 ESM JS 与 d.ts、package.json 的 bin/exports/types/files 指向。Avoid: 源码发布'
  - term: dry-run 彩排
    definition: npm pack 与 npm publish 的 dry-run 执行，只留证不产生真实发布与 tag
contracts:
  - to: ctx_ext
    contract:
      produces: 稳定的 CLI 命令面契约、config v2 格式与 dist 构建产物（含 d.ts）
      consumed_by:
        - artifact: integrations 各适配器与 pi 扩展加载面
          used_as: 对接 EvoFence CLI 与加载扩展的接入依据
      validation:
        criteria: 集成相关用例 0 failures，适配器调用的命令与 flag 均存在于命令面清单
  - to: ctx_ledger
    contract:
      produces: 共享类型契约层（零运行时依赖的类型定义）
      consumed_by:
        - artifact: ledger v2 模块
          used_as: 账本记录与哈希链结构的类型底座
      validation:
        criteria: tsc --noEmit 退出码 0，ledger 模块对类型层只做单向依赖
  - to: ctx_gate
    contract:
      produces: 共享类型契约层与配置解析结果
      consumed_by:
        - artifact: 门禁判定模块
          used_as: 判定输入输出类型与配置来源
      validation:
        criteria: tsc --noEmit 退出码 0，门禁模块不反向引用类型层以外的上游模块
  - to: ctx_exec
    contract:
      produces: 共享类型契约层与配置解析结果
      consumed_by:
        - artifact: 执行编排模块
          used_as: 运行参数、预算记账与产物清单的类型底座
      validation:
        criteria: npm run dep:check 退出码 0 且模块依赖图无环
