label: EvoFence TS 重构 0.4.0
entry:
  description: >-
    0.3.0 纯 JS ESM 现状：src 16 文件约 4400 行、手写 CLI dispatcher、better-sqlite3 与 yaml 两项运行时依赖、package.json 的 bin 直指 src 下 JS
    源码、无 tsconfig 与构建步骤。目标契约约束：重构为模块化 TypeScript 0.4.0，npm run build 产出 dist ESM JS 与 d.ts（含
    declarationMap），package.json 的 bin/exports/types/files 指向 dist；OIDC 发布流水线就绪且已彩排（npm pack 与 npm publish 的 dry-run
    留证）；不创建 tag、不真实发布；运行时依赖不变，仅允许新增构建期 devDependencies；不提供旧数据迁移；sha256 哈希链与 fail-closed 内核不变式必须保留并被测试覆盖。
  defined_by: human
  level: 0
exit:
  description: >-
    0.4.0 模块化 TypeScript 交付完成：src 按领域拆分且单文件 ≤350 行、模块依赖图无环；tsc --noEmit 退出码 0；npm run build 产出 dist ESM JS 与 d.ts 且含
    declarationMap；package.json 的 bin/exports/types/files 指向 dist 且全部子命令冒烟通过；npm test 0 failures 且含哈希链篡改负向测试与旧 12
    个测试文件的覆盖点映射表；npm pack --dry-run 清单含 dist 与 d.ts 且不含 src 的 TS 源与 test，npm publish --dry-run 成功留证；CI 与 publish
    workflow 含构建步骤且 OIDC 静态校验通过；README、README.en、AGENTS、CHANGELOG 与实现一致且 CHANGELOG 0.4.0 标 BREAKING 写明旧 ledger 与 config
    不兼容且不迁移；herdr 派单审计（模型白名单、worktree 隔离、pane 与 claim_by 对应）齐备。
  acceptance_criteria:
    - >-
      图交付面：graph validate 与 sp.mjs check-design --json 均输出 errors=0，图经人审 approve 落 design_approved 审计事件，全部工作流节点流转至
      passed
    - >-
      构建与命令面：tsc --noEmit 退出码 0，npm run build 产出 dist ESM JS 与 d.ts 且含 declarationMap，package.json 的
      bin/exports/types/files 指向 dist，重构后全部 CLI 子命令冒烟通过
    - 结构与内核：src 按领域拆分且单文件 ≤350 行，模块依赖环检查命令退出码 0 且报告无环，sha256 哈希链与 fail-closed 语义保留并有测试覆盖
    - 测试：npm test 退出码 0 且 failures 为 0，旧 12 个测试文件的覆盖点映射表齐备，含哈希链篡改负向用例
    - >-
      打包发布与文档审计：npm pack --dry-run 清单含 dist 与 d.ts 且不含 src 的 TS 源文件与 test 目录，npm publish --dry-run 退出码 0 留证，CI 与 publish
      workflow 含构建步骤且 OIDC 静态校验通过，git tag 相对 0.3.0 无新增，README/README.en/AGENTS/CHANGELOG 与实现一致且 CHANGELOG 0.4.0 标
      BREAKING 写明旧 ledger 与 config 不兼容不迁移，herdr 派单审计（模型白名单 + worktree 隔离 + pane 与 claim_by 对应）齐备
