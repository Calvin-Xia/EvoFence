id: ctx_ledger
type: context
label: 审计账本域
level: 1
status: pending
attempts: 0
max_attempts: 3
created_at: '2026-09-27T06:09:14.062Z'
updated_at: '2026-09-27T06:10:50.102Z'
boundary: >-
  负责审计账本与哈希链内核：ledger 记录的 schema、sha256 的 prev/hash 链式校验与 fail-closed 校验语义；不负责执行与判定逻辑（记录内容由 ctx_exec 与 ctx_gate
  产生）、对外视图渲染（读取接口由 ctx_io 视图层消费）与配置解析（配置格式属 ctx_io）。旧版本账本读取按显式不兼容处理，不提供迁移。
glossary:
  - term: 哈希链
    definition: '账本记录以 sha256 按 prev 与 hash 串联的链式结构，任一记录被改动都会导致校验失败。Avoid: 校验和列表'
  - term: 账本记录
    definition: 账本中的一条不可变条目，含载荷与链式校验字段，schema 随 ledger v2 破坏性调整
  - term: 不兼容读取
    definition: '遇到旧版本账本格式时显式报错并拒绝继续，不做静默转换。Avoid: 自动迁移、兼容模式'
contracts:
  - to: ctx_io
    contract:
      produces: ledger v2 记录与哈希链校验结果（含断裂位置）
      consumed_by:
        - artifact: 报告/状态/审计视图与单元测试套件
          used_as: 审计展示数据与哈希链篡改负向断言的输入
      validation:
        criteria: 账本校验命令在有效账本上退出码 0，篡改后退出码非 0 并指出断裂记录，旧格式读取显式失败
