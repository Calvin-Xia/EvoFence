id: adr_0005
type: adr
label: 模块依赖方向：类型契约层在最底层，单向依赖无环
level: 1
status: accepted
attempts: 0
max_attempts: 0
created_at: '2026-09-27T06:17:29.569Z'
updated_at: '2026-09-27T06:23:10.279Z'
decision: 模块依赖方向固定为：共享类型契约层在最底层，各领域模块单向向下依赖它，禁止反向引用与跨层互引；模块依赖图必须无环，由依赖环检查命令守住。
background: 0.3.0 的 16 个文件在模块化后若依赖方向随意，会重新长出耦合；目标契约要求模块依赖图无环，需要把依赖方向定成可被工具检查的约定。
considered_options: >-
  A 不约定方向只查无环 → 落选：无环仍可任意跨层耦合，重构后易退化；B 类型契约层最底部分层单向加依赖环检查 → 选中：方向可被工具检查，边界与 bounded context 对齐；C 拆多包 workspace 用构建层强制 →
  落选：把单包项目复杂化，超出本次范围
why: 单向分层让每个领域的模块边界与 context 边界重合，依赖环检查提供机器判据。
consequences: 类型契约层不得引用任何领域模块；跨域协作只能经类型与显式接口；新增模块要先定归属层；违反时依赖环检查命令失败。
